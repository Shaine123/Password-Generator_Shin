<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="images/password-manager.png" />
  </head>
  <body>
    <div class="container">
      <h1>Password Generator</h1>

      <div class="password-container">
        <input type="text" id="password" readonly />
        <i class="fa-regular fa-copy"></i>
      </div>

      <div class="options">
        <div class="option">
          <label for="password-length">Password Length</label>
          <div class="range-container">
            <input type="range" id="password-length" max="15" min="6" />
            <span id="length-value">11</span>
          </div>
        </div>

        <div class="option">
          <label for="includeUppercase">Include Uppercase</label>
          <input type="checkbox" id="includeUppercase" checked />
        </div>

        <div class="option">
          <label for="includeLowercase">Include Lowercase</label>
          <input type="checkbox" id="includeLowercase" checked />
        </div>

        <div class="option">
          <label for="includeNumbers">Include Numbers</label>
          <input type="checkbox" id="includeNumbers" checked />
        </div>

        <div class="option">
          <label for="includeSymbols">Include Symbols</label>
          <input type="checkbox" id="includeSymbols" checked />
        </div>
      </div>

      <button id="generatePassword">
        <i class="fa-solid fa-key"></i>
        Generate Password
      </button>

      <div class="strength-container">
        <p>Password Strength: <span id="strength-type">Strong</span></p>
        <div class="meter-container">
          <div class="meter" id="meter"></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <script
      src="https://kit.fontawesome.com/783d5fc8be.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
